<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>k37 – Games</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse at top, #1a120b 0%, #0a0705 100%);
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #f5e6c8;
      padding: 24px;
    }
    h1 {
      font-size: clamp(28px, 8vw, 42px);
      color: #ffd700;
      margin-bottom: 8px;
      text-shadow: 0 0 24px rgba(255,200,0,0.35);
    }
    .sub {
      opacity: 0.75;
      margin-bottom: 36px;
      font-size: 15px;
    }
    .games {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
      max-width: 720px;
    }
    a.card {
      display: block;
      width: min(300px, 90vw);
      padding: 28px 24px;
      border-radius: 16px;
      text-decoration: none;
      color: inherit;
      border: 1px solid rgba(212,175,55,0.35);
      background: rgba(0,0,0,0.45);
      transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
      text-align: center;
    }
    a.card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 32px rgba(0,0,0,0.5);
      border-color: rgba(255,215,0,0.6);
    }
    a.card.primary {
      background: linear-gradient(145deg, rgba(201,162,39,0.25), rgba(0,0,0,0.5));
      border-color: rgba(255,215,0,0.55);
    }
    a.card h2 {
      font-size: 22px;
      margin-bottom: 8px;
      color: #ffd700;
    }
    a.card p {
      font-size: 14px;
      opacity: 0.85;
      line-height: 1.45;
    }
    .badge {
      display: inline-block;
      margin-top: 12px;
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 20px;
      background: rgba(255,215,0,0.2);
      color: #ffd700;
    }
  </style>
</head>
<body>
  <h1>k37 Games</h1>
  <p class="sub">Choose a game</p>

  <div class="games">
    <a class="card primary" href="carrom.html">
      <h2>Carrom</h2>
      <p>Classic Indian board game with real physics, Queen, pockets &amp; turns.</p>
      <span class="badge">Recommended</span>
    </a>

    <a class="card" href="runner.html">
      <h2>Temple Run 3D</h2>
      <p>Endless runner – jump, slide, coins, aliens &amp; fox chase.</p>
    </a>
  </div>
</body>
</html>
