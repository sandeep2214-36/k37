<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Temple Run 3D – Endless Runner</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #000;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    #game-container {
      position: relative;
      width: 100%; height: 100%;
    }
    canvas {
      display: block;
      width: 100%; height: 100%;
    }
    /* UI Overlay */
    #ui {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 10;
    }
    #score-board {
      position: absolute;
      top: 16px; left: 16px;
      color: #fff;
      text-shadow: 0 2px 6px rgba(0,0,0,0.8);
      font-size: clamp(16px, 4vw, 22px);
      font-weight: 700;
      line-height: 1.4;
    }
    #score-board span { color: #ffd700; }
    /* Screens */
    .screen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.72);
      color: #fff;
      pointer-events: auto;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.35s ease, visibility 0.35s;
      text-align: center;
      padding: 20px;
    }
    .screen.active {
      opacity: 1;
      visibility: visible;
    }
    .screen h1 {
      font-size: clamp(32px, 10vw, 56px);
      margin-bottom: 8px;
      letter-spacing: 2px;
      text-shadow: 0 0 20px rgba(255,180,0,0.6);
    }
    .screen p {
      font-size: clamp(14px, 4vw, 18px);
      opacity: 0.9;
      margin-bottom: 24px;
      max-width: 360px;
    }
    .btn {
      background: linear-gradient(135deg, #ff9a00, #ff5e00);
      border: none;
      color: #fff;
      font-size: clamp(16px, 4.5vw, 20px);
      font-weight: 700;
      padding: 14px 36px;
      border-radius: 40px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(255,100,0,0.45);
      transition: transform 0.15s, box-shadow 0.15s;
      pointer-events: auto;
    }
    .btn:hover, .btn:active {
      transform: scale(1.05);
      box-shadow: 0 8px 28px rgba(255,100,0,0.6);
    }
    .controls-hint {
      margin-top: 28px;
      font-size: 13px;
      opacity: 0.7;
      line-height: 1.6;
    }
    #final-score {
      font-size: clamp(22px, 6vw, 32px);
      margin: 12px 0 8px;
      color: #ffd700;
    }
    #high-score-display {
      font-size: 15px;
      opacity: 0.85;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <div id="ui">
      <div id="score-board">
        Score: <span id="score">0</span><br>
        Best: <span id="highscore">0</span>
      </div>
    </div>

    <!-- Start Screen -->
    <div id="start-screen" class="screen active">
      <h1>TEMPLE RUN 3D</h1>
      <p>Endless runner – dodge obstacles, collect coins &amp; run as far as you can!</p>
      <button class="btn" id="start-btn">TAP TO PLAY</button>
      <div class="controls-hint">
        ← → or Swipe : Change lane<br>
        ↑ or Swipe Up : Jump (hurdles, aliens &amp; fox)<br>
        ↓ or Swipe Down : Slide<br>
        <span style="color:#39ff14">⚠ Aliens appear suddenly!</span><br>
        <span style="color:#e67e22">🦊 Fox chases you from behind!</span>
      </div>
    </div>

    <!-- Game Over Screen -->
    <div id="gameover-screen" class="screen">
      <h1>GAME OVER</h1>
      <div id="final-score">0</div>
      <div id="high-score-display">Best: 0</div>
      <button class="btn" id="restart-btn">PLAY AGAIN</button>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';

    // ============================================================
    // CONFIG
    // ============================================================
    const LANES = [-2.2, 0, 2.2];          // X positions of the 3 lanes
    const LANE_SWITCH_SPEED = 12;          // how fast player slides between lanes
    const JUMP_FORCE = 11;
    const GRAVITY = 28;
    const SLIDE_DURATION = 0.75;           // seconds
    const PLAYER_HEIGHT = 1.6;
    const PLAYER_RADIUS = 0.45;

    const SEGMENT_LENGTH = 20;             // length of each track piece
    const VISIBLE_SEGMENTS = 8;
    const OBSTACLE_CHANCE = 0.55;
    const COIN_CHANCE = 0.7;

    const BASE_SPEED = 18;
    const SPEED_INCREASE = 0.35;           // per 100 distance
    const MAX_SPEED = 42;

    // Alien sudden spawn
    const ALIEN_SPAWN_MIN_DIST = 80;       // start appearing after this distance
    const ALIEN_SPAWN_INTERVAL = 4.5;      // seconds between possible spawns
    const ALIEN_SPAWN_CHANCE = 0.55;       // chance when timer hits

    // Fox chase
    const FOX_SPAWN_MIN_DIST = 120;        // fox starts chasing after this distance
    const FOX_SPAWN_INTERVAL = 11;         // seconds between fox appearances
    const FOX_CATCH_DISTANCE = 1.4;        // how close = caught

    // ============================================================
    // STATE
    // ============================================================
    let scene, camera, renderer;
    let player, playerMesh;
    let trackGroup;
    let obstacles = [];
    let coins = [];
    let aliens = [];
    let fox = null;                        // single chasing fox
    let segments = [];

    let gameState = 'menu'; // menu | playing | gameover
    let score = 0;
    let highScore = parseInt(localStorage.getItem('templeRunHighScore') || '0', 10);
    let distance = 0;
    let speed = BASE_SPEED;
    let collectedCoinBonus = 0;
    let alienSpawnTimer = 0;
    let foxSpawnTimer = 0;

    // Player physics
    let currentLane = 1;           // 0=left, 1=center, 2=right
    let targetLane = 1;
    let playerY = 0;
    let velocityY = 0;
    let isJumping = false;
    let isSliding = false;
    let slideTimer = 0;
    let playerZ = 0;               // player stays roughly at z=0, world moves

    // Input
    let keys = {};
    let touchStartX = 0, touchStartY = 0;
    let swipeHandled = false;

    // Clock
    const clock = new THREE.Clock();

    // ============================================================
    // INIT
    // ============================================================
    function init() {
      // Renderer
      renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      document.getElementById('game-container').prepend(renderer.domElement);

      // Scene
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x87CEEB);
      scene.fog = new THREE.Fog(0x87CEEB, 35, 90);

      // Camera
      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 120);
      camera.position.set(0, 5.5, 8);
      camera.lookAt(0, 1.5, -10);

      // Lights
      const hemi = new THREE.HemisphereLight(0xffffff, 0x444422, 0.7);
      scene.add(hemi);

      const dir = new THREE.DirectionalLight(0xffffff, 1.1);
      dir.position.set(8, 20, 10);
      dir.castShadow = true;
      dir.shadow.mapSize.set(1024, 1024);
      dir.shadow.camera.near = 1;
      dir.shadow.camera.far = 60;
      dir.shadow.camera.left = -15;
      dir.shadow.camera.right = 15;
      dir.shadow.camera.top = 15;
      dir.shadow.camera.bottom = -15;
      scene.add(dir);

      // Ambient fill
      scene.add(new THREE.AmbientLight(0x404040, 0.4));

      // Groups
      trackGroup = new THREE.Group();
      scene.add(trackGroup);

      // Player
      createPlayer();

      // Initial track
      for (let i = 0; i < VISIBLE_SEGMENTS; i++) {
        spawnSegment(i * -SEGMENT_LENGTH);
      }

      // UI
      document.getElementById('highscore').textContent = highScore;

      // Events
      window.addEventListener('resize', onResize);
      window.addEventListener('keydown', onKeyDown);
      window.addEventListener('keyup', onKeyUp);

      // Touch
      const canvas = renderer.domElement;
      canvas.addEventListener('touchstart', onTouchStart, { passive: false });
      canvas.addEventListener('touchmove', onTouchMove, { passive: false });
      canvas.addEventListener('touchend', onTouchEnd, { passive: false });

      document.getElementById('start-btn').addEventListener('click', startGame);
      document.getElementById('restart-btn').addEventListener('click', startGame);

      // Prevent context menu on long press
      canvas.addEventListener('contextmenu', e => e.preventDefault());

      animate();
    }

    // ============================================================
    // PLAYER
    // ============================================================
    function createPlayer() {
      player = new THREE.Group();
      player.position.set(0, 0, 0);

      // Body (capsule-ish using cylinders + spheres for simplicity)
      const bodyMat = new THREE.MeshStandardMaterial({ color: 0xe67e22, roughness: 0.4, metalness: 0.1 });
      const headMat = new THREE.MeshStandardMaterial({ color: 0xf5cba7, roughness: 0.5 });

      // Torso
      const torso = new THREE.Mesh(
        new THREE.BoxGeometry(0.7, 0.9, 0.45),
        bodyMat
      );
      torso.position.y = 1.05;
      torso.castShadow = true;
      player.add(torso);

      // Head
      const head = new THREE.Mesh(new THREE.SphereGeometry(0.32, 16, 12), headMat);
      head.position.y = 1.75;
      head.castShadow = true;
      player.add(head);

      // Legs
      const legGeo = new THREE.CylinderGeometry(0.14, 0.16, 0.7, 8);
      const legMat = new THREE.MeshStandardMaterial({ color: 0x2c3e50 });
      const leftLeg = new THREE.Mesh(legGeo, legMat);
      leftLeg.position.set(-0.18, 0.35, 0);
      leftLeg.castShadow = true;
      player.add(leftLeg);

      const rightLeg = new THREE.Mesh(legGeo, legMat);
      rightLeg.position.set(0.18, 0.35, 0);
      rightLeg.castShadow = true;
      player.add(rightLeg);

      // Arms
      const armGeo = new THREE.CylinderGeometry(0.1, 0.12, 0.6, 8);
      const leftArm = new THREE.Mesh(armGeo, bodyMat);
      leftArm.position.set(-0.48, 1.1, 0);
      leftArm.rotation.z = 0.3;
      leftArm.castShadow = true;
      player.add(leftArm);

      const rightArm = new THREE.Mesh(armGeo, bodyMat);
      rightArm.position.set(0.48, 1.1, 0);
      rightArm.rotation.z = -0.3;
      rightArm.castShadow = true;
      player.add(rightArm);

      // Simple running animation helpers (we will scale/rotate a bit)
      player.userData = { leftLeg, rightLeg, leftArm, rightArm, torso, head };

      scene.add(player);
      playerMesh = player;
    }

    // ============================================================
    // TRACK / SEGMENTS
    // ============================================================
    function spawnSegment(zPos) {
      const seg = new THREE.Group();
      seg.position.z = zPos;

      // Ground
      const groundGeo = new THREE.BoxGeometry(10, 0.4, SEGMENT_LENGTH);
      const groundMat = new THREE.MeshStandardMaterial({
        color: 0x8B7355,
        roughness: 0.85
      });
      const ground = new THREE.Mesh(groundGeo, groundMat);
      ground.position.y = -0.2;
      ground.receiveShadow = true;
      seg.add(ground);

      // Side walls / cliffs
      const wallMat = new THREE.MeshStandardMaterial({ color: 0x5D4E37, roughness: 0.9 });
      const leftWall = new THREE.Mesh(new THREE.BoxGeometry(1.2, 3.5, SEGMENT_LENGTH), wallMat);
      leftWall.position.set(-5.2, 1.5, 0);
      leftWall.castShadow = true;
      leftWall.receiveShadow = true;
      seg.add(leftWall);

      const rightWall = new THREE.Mesh(new THREE.BoxGeometry(1.2, 3.5, SEGMENT_LENGTH), wallMat);
      rightWall.position.set(5.2, 1.5, 0);
      rightWall.castShadow = true;
      rightWall.receiveShadow = true;
      seg.add(rightWall);

      // Decorative pillars / temple feel
      if (Math.random() > 0.4) {
        const pillarGeo = new THREE.CylinderGeometry(0.35, 0.45, 3.2, 8);
        const pillarMat = new THREE.MeshStandardMaterial({ color: 0xA0522D });
        [-4.2, 4.2].forEach(x => {
          const p = new THREE.Mesh(pillarGeo, pillarMat);
          p.position.set(x, 1.4, (Math.random() - 0.5) * 12);
          p.castShadow = true;
          seg.add(p);
        });
      }

      // Obstacles & coins (skip first few segments for safety)
      const isSafe = Math.abs(zPos) < SEGMENT_LENGTH * 1.5;
      if (!isSafe) {
        maybeSpawnObstacles(seg, zPos);
        maybeSpawnCoins(seg, zPos);
      }

      trackGroup.add(seg);
      segments.push({ mesh: seg, z: zPos });
    }

    function maybeSpawnObstacles(seg, baseZ) {
      // Decide how many obstacles (0-2)
      if (Math.random() > OBSTACLE_CHANCE) return;

      const types = ['low', 'high', 'wall'];
      const type = types[Math.floor(Math.random() * types.length)];
      const lane = Math.floor(Math.random() * 3);
      const localZ = (Math.random() - 0.5) * (SEGMENT_LENGTH - 6);

      let obstacle;
      if (type === 'low') {
        // Low hurdle – jump over
        const geo = new THREE.BoxGeometry(1.6, 0.7, 0.5);
        const mat = new THREE.MeshStandardMaterial({ color: 0x8B4513 });
        obstacle = new THREE.Mesh(geo, mat);
        obstacle.position.set(LANES[lane], 0.35, localZ);
        obstacle.userData = { type: 'low', lane, height: 0.7 };
      } else if (type === 'high') {
        // High bar – slide under
        const geo = new THREE.BoxGeometry(1.8, 0.5, 0.4);
        const mat = new THREE.MeshStandardMaterial({ color: 0x654321 });
        obstacle = new THREE.Mesh(geo, mat);
        obstacle.position.set(LANES[lane], 1.55, localZ);
        // Vertical supports
        const supportGeo = new THREE.BoxGeometry(0.2, 1.5, 0.2);
        const s1 = new THREE.Mesh(supportGeo, mat);
        s1.position.set(-0.7, -0.75, 0);
        obstacle.add(s1);
        const s2 = new THREE.Mesh(supportGeo, mat);
        s2.position.set(0.7, -0.75, 0);
        obstacle.add(s2);
        obstacle.userData = { type: 'high', lane, height: 1.8 };
      } else {
        // Full wall – must change lane
        const geo = new THREE.BoxGeometry(1.9, 2.2, 0.6);
        const mat = new THREE.MeshStandardMaterial({ color: 0x5C4033 });
        obstacle = new THREE.Mesh(geo, mat);
        obstacle.position.set(LANES[lane], 1.1, localZ);
        obstacle.userData = { type: 'wall', lane, height: 2.2 };
      }

      obstacle.castShadow = true;
      obstacle.receiveShadow = true;
      seg.add(obstacle);

      // World position will be tracked later
      obstacles.push({
        mesh: obstacle,
        lane,
        type: obstacle.userData.type,
        baseSegZ: baseZ,
        localZ,
        collected: false // not really, just for consistency
      });
    }

    function maybeSpawnCoins(seg, baseZ) {
      if (Math.random() > COIN_CHANCE) return;

      const count = 1 + Math.floor(Math.random() * 3);
      const startLane = Math.floor(Math.random() * 3);
      const localZ = (Math.random() - 0.5) * (SEGMENT_LENGTH - 8);

      for (let i = 0; i < count; i++) {
        const lane = (startLane + i) % 3;
        const coin = createCoin();
        coin.position.set(LANES[lane], 1.1, localZ - i * 1.8);
        seg.add(coin);

        coins.push({
          mesh: coin,
          lane,
          baseSegZ: baseZ,
          localZ: localZ - i * 1.8,
          collected: false
        });
      }
    }

    function createCoin() {
      const geo = new THREE.CylinderGeometry(0.35, 0.35, 0.12, 16);
      const mat = new THREE.MeshStandardMaterial({
        color: 0xFFD700,
        metalness: 0.85,
        roughness: 0.25,
        emissive: 0x886600,
        emissiveIntensity: 0.25
      });
      const coin = new THREE.Mesh(geo, mat);
      coin.rotation.x = Math.PI / 2;
      coin.castShadow = true;
      return coin;
    }

    // ============================================================
    // ALIENS (sudden spawn)
    // ============================================================
    function createAlien() {
      const alien = new THREE.Group();

      // Body – glowing green
      const bodyMat = new THREE.MeshStandardMaterial({
        color: 0x39ff14,
        emissive: 0x1a8f0a,
        emissiveIntensity: 0.6,
        roughness: 0.4,
        metalness: 0.2
      });
      const body = new THREE.Mesh(new THREE.SphereGeometry(0.55, 16, 12), bodyMat);
      body.position.y = 1.1;
      body.castShadow = true;
      alien.add(body);

      // Big head
      const head = new THREE.Mesh(new THREE.SphereGeometry(0.48, 16, 12), bodyMat);
      head.position.y = 1.85;
      head.scale.set(1.1, 1.15, 1);
      head.castShadow = true;
      alien.add(head);

      // Huge black eyes
      const eyeMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.3 });
      const eyeGeo = new THREE.SphereGeometry(0.18, 12, 8);
      const leftEye = new THREE.Mesh(eyeGeo, eyeMat);
      leftEye.position.set(-0.22, 1.95, 0.35);
      alien.add(leftEye);
      const rightEye = new THREE.Mesh(eyeGeo, eyeMat);
      rightEye.position.set(0.22, 1.95, 0.35);
      alien.add(rightEye);

      // Antennae
      const antMat = new THREE.MeshStandardMaterial({ color: 0x2ecc71 });
      const antGeo = new THREE.CylinderGeometry(0.04, 0.04, 0.5, 6);
      const leftAnt = new THREE.Mesh(antGeo, antMat);
      leftAnt.position.set(-0.2, 2.45, 0);
      leftAnt.rotation.z = 0.35;
      alien.add(leftAnt);
      const rightAnt = new THREE.Mesh(antGeo, antMat);
      rightAnt.position.set(0.2, 2.45, 0);
      rightAnt.rotation.z = -0.35;
      alien.add(rightAnt);

      // Antenna tips (glowing)
      const tipMat = new THREE.MeshStandardMaterial({
        color: 0xff00ff,
        emissive: 0xff00ff,
        emissiveIntensity: 1.2
      });
      const tipGeo = new THREE.SphereGeometry(0.1, 8, 6);
      const leftTip = new THREE.Mesh(tipGeo, tipMat);
      leftTip.position.set(-0.35, 2.7, 0);
      alien.add(leftTip);
      const rightTip = new THREE.Mesh(tipGeo, tipMat);
      rightTip.position.set(0.35, 2.7, 0);
      alien.add(rightTip);

      // Thin legs
      const legMat = new THREE.MeshStandardMaterial({ color: 0x27ae60 });
      const legGeo = new THREE.CylinderGeometry(0.08, 0.1, 0.7, 6);
      [-0.25, 0.25].forEach(x => {
        const leg = new THREE.Mesh(legGeo, legMat);
        leg.position.set(x, 0.35, 0);
        leg.castShadow = true;
        alien.add(leg);
      });

      alien.userData = { bobPhase: Math.random() * Math.PI * 2 };
      return alien;
    }

    function spawnSuddenAlien() {
      // Pick a random lane (prefer player's current / target lane for surprise)
      const preferPlayer = Math.random() < 0.55;
      const lane = preferPlayer
        ? targetLane
        : Math.floor(Math.random() * 3);

      const alien = createAlien();
      // Spawn ahead of player so it suddenly appears in view
      const spawnZ = -28 - Math.random() * 10;
      alien.position.set(LANES[lane], 0, spawnZ);
      scene.add(alien);

      aliens.push({
        mesh: alien,
        lane,
        z: spawnZ,
        speed: speed * (0.35 + Math.random() * 0.25), // approaches player
        alive: true
      });
    }

    // ============================================================
    // FOX (sudden chase)
    // ============================================================
    function createFox() {
      const foxGroup = new THREE.Group();

      // Body
      const bodyMat = new THREE.MeshStandardMaterial({
        color: 0xe67e22,
        roughness: 0.7,
        metalness: 0.05
      });
      const body = new THREE.Mesh(new THREE.SphereGeometry(0.45, 14, 10), bodyMat);
      body.scale.set(1.4, 0.85, 0.9);
      body.position.y = 0.75;
      body.castShadow = true;
      foxGroup.add(body);

      // Head
      const head = new THREE.Mesh(new THREE.SphereGeometry(0.32, 12, 10), bodyMat);
      head.position.set(0, 1.05, 0.45);
      head.castShadow = true;
      foxGroup.add(head);

      // Snout
      const snoutMat = new THREE.MeshStandardMaterial({ color: 0xd35400 });
      const snout = new THREE.Mesh(new THREE.ConeGeometry(0.14, 0.35, 8), snoutMat);
      snout.rotation.x = Math.PI / 2;
      snout.position.set(0, 0.95, 0.75);
      foxGroup.add(snout);

      // Ears
      const earMat = new THREE.MeshStandardMaterial({ color: 0xc0392b });
      const earGeo = new THREE.ConeGeometry(0.12, 0.35, 6);
      const leftEar = new THREE.Mesh(earGeo, earMat);
      leftEar.position.set(-0.18, 1.4, 0.4);
      leftEar.rotation.z = -0.25;
      foxGroup.add(leftEar);
      const rightEar = new THREE.Mesh(earGeo, earMat);
      rightEar.position.set(0.18, 1.4, 0.4);
      rightEar.rotation.z = 0.25;
      foxGroup.add(rightEar);

      // Eyes
      const eyeMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a });
      const eyeGeo = new THREE.SphereGeometry(0.07, 8, 6);
      const leftEye = new THREE.Mesh(eyeGeo, eyeMat);
      leftEye.position.set(-0.12, 1.12, 0.68);
      foxGroup.add(leftEye);
      const rightEye = new THREE.Mesh(eyeGeo, eyeMat);
      rightEye.position.set(0.12, 1.12, 0.68);
      foxGroup.add(rightEye);

      // Legs
      const legMat = new THREE.MeshStandardMaterial({ color: 0xd35400 });
      const legGeo = new THREE.CylinderGeometry(0.07, 0.09, 0.55, 6);
      const legPositions = [
        [-0.28, 0.28, 0.2],
        [0.28, 0.28, 0.2],
        [-0.28, 0.28, -0.25],
        [0.28, 0.28, -0.25]
      ];
      legPositions.forEach(pos => {
        const leg = new THREE.Mesh(legGeo, legMat);
        leg.position.set(...pos);
        leg.castShadow = true;
        foxGroup.add(leg);
      });

      // Tail (bushy)
      const tailMat = new THREE.MeshStandardMaterial({ color: 0xe67e22 });
      const tail = new THREE.Mesh(new THREE.SphereGeometry(0.22, 10, 8), tailMat);
      tail.scale.set(0.7, 0.7, 1.6);
      tail.position.set(0, 0.85, -0.7);
      tail.rotation.x = -0.4;
      foxGroup.add(tail);

      // White tip on tail
      const tip = new THREE.Mesh(
        new THREE.SphereGeometry(0.12, 8, 6),
        new THREE.MeshStandardMaterial({ color: 0xf5f5f5 })
      );
      tip.position.set(0, 0.7, -1.15);
      foxGroup.add(tip);

      foxGroup.userData = { runPhase: 0 };
      return foxGroup;
    }

    function spawnFox() {
      if (fox) {
        scene.remove(fox.mesh);
        fox = null;
      }

      const mesh = createFox();
      // Spawn behind the player so it chases from behind
      const startZ = 8 + Math.random() * 4;
      const lane = targetLane;
      mesh.position.set(LANES[lane], 0, startZ);
      // Face toward the run direction (negative Z)
      mesh.rotation.y = Math.PI;
      scene.add(mesh);

      fox = {
        mesh,
        lane,
        targetLane: lane,
        z: startZ,
        speed: speed * 1.15, // slightly faster than player so it catches up
        alive: true,
        lifetime: 9 // disappears after some time if not caught
      };
    }

    // ============================================================
    // GAME FLOW
    // ============================================================
    function startGame() {
      // Reset everything
      score = 0;
      distance = 0;
      speed = BASE_SPEED;
      collectedCoinBonus = 0;
      alienSpawnTimer = 2.5; // first possible alien after a short delay
      foxSpawnTimer = 6;
      currentLane = 1;
      targetLane = 1;
      playerY = 0;
      velocityY = 0;
      isJumping = false;
      isSliding = false;
      slideTimer = 0;
      playerZ = 0;

      // Clear old track
      while (trackGroup.children.length) {
        trackGroup.remove(trackGroup.children[0]);
      }
      segments = [];
      obstacles = [];
      coins = [];

      // Clear aliens
      aliens.forEach(a => scene.remove(a.mesh));
      aliens = [];

      // Clear fox
      if (fox) {
        scene.remove(fox.mesh);
        fox = null;
      }

      // Rebuild track
      for (let i = 0; i < VISIBLE_SEGMENTS; i++) {
        spawnSegment(i * -SEGMENT_LENGTH);
      }

      player.position.set(LANES[1], 0, 0);
      player.rotation.set(0, 0, 0);
      player.scale.set(1, 1, 1);

      document.getElementById('score').textContent = '0';
      document.getElementById('start-screen').classList.remove('active');
      document.getElementById('gameover-screen').classList.remove('active');

      gameState = 'playing';
      clock.start();
    }

    function gameOver() {
      if (gameState !== 'playing') return;
      gameState = 'gameover';

      if (score > highScore) {
        highScore = score;
        localStorage.setItem('templeRunHighScore', highScore.toString());
      }

      document.getElementById('final-score').textContent = `Score: ${score}`;
      document.getElementById('high-score-display').textContent = `Best: ${highScore}`;
      document.getElementById('highscore').textContent = highScore;
      document.getElementById('gameover-screen').classList.add('active');
    }

    // ============================================================
    // INPUT
    // ============================================================
    function onKeyDown(e) {
      keys[e.code] = true;
      if (gameState !== 'playing') return;

      if (e.code === 'ArrowLeft' || e.code === 'KeyA') changeLane(-1);
      if (e.code === 'ArrowRight' || e.code === 'KeyD') changeLane(1);
      if (e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Space') jump();
      if (e.code === 'ArrowDown' || e.code === 'KeyS') slide();
    }
    function onKeyUp(e) { keys[e.code] = false; }

    function changeLane(dir) {
      const next = targetLane + dir;
      if (next >= 0 && next <= 2) targetLane = next;
    }

    function jump() {
      if (!isJumping && !isSliding && playerY < 0.1) {
        isJumping = true;
        velocityY = JUMP_FORCE;
      }
    }

    function slide() {
      if (!isSliding && !isJumping && playerY < 0.1) {
        isSliding = true;
        slideTimer = SLIDE_DURATION;
      }
    }

    // Touch / Swipe
    function onTouchStart(e) {
      e.preventDefault();
      if (e.touches.length === 0) return;
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
      swipeHandled = false;
    }

    function onTouchMove(e) {
      e.preventDefault();
      if (gameState !== 'playing' || swipeHandled || e.touches.length === 0) return;

      const dx = e.touches[0].clientX - touchStartX;
      const dy = e.touches[0].clientY - touchStartY;
      const absDx = Math.abs(dx);
      const absDy = Math.abs(dy);
      const threshold = 35;

      if (absDx > threshold || absDy > threshold) {
        swipeHandled = true;
        if (absDx > absDy) {
          // Horizontal
          if (dx > 0) changeLane(1);
          else changeLane(-1);
        } else {
          // Vertical
          if (dy < 0) jump();
          else slide();
        }
      }
    }

    function onTouchEnd(e) {
      e.preventDefault();
      // simple tap on start screen is already handled by button
    }

    // ============================================================
    // UPDATE LOOP
    // ============================================================
    function update(dt) {
      if (gameState !== 'playing') return;

      // Progressive speed
      speed = Math.min(MAX_SPEED, BASE_SPEED + (distance / 100) * SPEED_INCREASE);

      // Move world toward player (player stays near z=0)
      const move = speed * dt;
      distance += move;
      score = Math.floor(distance) + collectedCoinBonus;

      // Update score UI occasionally
      document.getElementById('score').textContent = score;

      // Move all segments
      for (let i = segments.length - 1; i >= 0; i--) {
        const s = segments[i];
        s.mesh.position.z += move;
        s.z += move;

        // Recycle segment that went behind the player
        if (s.z > SEGMENT_LENGTH * 1.6) {
          // Clean up obstacles & coins that belonged to this segment
          obstacles = obstacles.filter(o => o.mesh.parent !== s.mesh);
          coins = coins.filter(c => c.mesh.parent !== s.mesh);

          trackGroup.remove(s.mesh);
          // Dispose geometries/materials if needed (omitted for brevity)
          segments.splice(i, 1);

          // Spawn a new segment far ahead
          const farthestZ = segments.reduce((min, seg) => Math.min(min, seg.z), 0);
          spawnSegment(farthestZ - SEGMENT_LENGTH);
        }
      }

      // Update obstacle / coin world Z (for collision)
      // Since they are children of segments, their world position changes with parent

      // ----- Sudden Alien Spawns -----
      if (distance > ALIEN_SPAWN_MIN_DIST) {
        alienSpawnTimer -= dt;
        if (alienSpawnTimer <= 0) {
          if (Math.random() < ALIEN_SPAWN_CHANCE && aliens.length < 3) {
            spawnSuddenAlien();
          }
          // Reset timer with a bit of randomness
          alienSpawnTimer = ALIEN_SPAWN_INTERVAL * (0.7 + Math.random() * 0.8);
        }
      }

      // ----- Update Aliens -----
      for (let i = aliens.length - 1; i >= 0; i--) {
        const a = aliens[i];
        if (!a.alive) continue;

        // Move toward player (positive Z direction)
        a.z += a.speed * dt;
        a.mesh.position.z = a.z;

        // Gentle bob + hover animation
        const bob = Math.sin(distance * 0.15 + a.mesh.userData.bobPhase) * 0.18;
        a.mesh.position.y = bob;
        a.mesh.rotation.y += dt * 1.8;

        // Remove if passed the player
        if (a.z > 6) {
          scene.remove(a.mesh);
          aliens.splice(i, 1);
        }
      }

      // ----- Fox chase (sudden) -----
      if (distance > FOX_SPAWN_MIN_DIST) {
        foxSpawnTimer -= dt;
        if (foxSpawnTimer <= 0 && !fox) {
          spawnFox();
          foxSpawnTimer = FOX_SPAWN_INTERVAL * (0.8 + Math.random() * 0.5);
        }
      }

      if (fox && fox.alive) {
        fox.lifetime -= dt;

        // Chase player's lane
        if (Math.random() < 0.03) {
          fox.targetLane = targetLane;
        }
        // Smooth lane change
        const foxTargetX = LANES[fox.targetLane];
        const fdx = foxTargetX - fox.mesh.position.x;
        if (Math.abs(fdx) > 0.08) {
          fox.mesh.position.x += Math.sign(fdx) * Math.min(Math.abs(fdx), 9 * dt);
        } else {
          fox.mesh.position.x = foxTargetX;
          fox.lane = fox.targetLane;
        }

        // Move toward player (decrease z toward 0)
        fox.z -= fox.speed * dt;
        fox.mesh.position.z = fox.z;

        // Run animation bob
        fox.mesh.userData.runPhase += dt * 14;
        const runBob = Math.abs(Math.sin(fox.mesh.userData.runPhase)) * 0.12;
        fox.mesh.position.y = runBob;

        // Despawn if lifetime over or went too far past
        if (fox.lifetime <= 0 || fox.z < -8) {
          scene.remove(fox.mesh);
          fox = null;
        }
      }

      // ----- Player horizontal (lane) -----
      const targetX = LANES[targetLane];
      const dx = targetX - player.position.x;
      if (Math.abs(dx) > 0.05) {
        player.position.x += Math.sign(dx) * Math.min(Math.abs(dx), LANE_SWITCH_SPEED * dt);
      } else {
        player.position.x = targetX;
        currentLane = targetLane;
      }

      // ----- Jump / Gravity -----
      if (isJumping || playerY > 0) {
        velocityY -= GRAVITY * dt;
        playerY += velocityY * dt;
        if (playerY <= 0) {
          playerY = 0;
          velocityY = 0;
          isJumping = false;
        }
      }

      // ----- Slide -----
      if (isSliding) {
        slideTimer -= dt;
        if (slideTimer <= 0) {
          isSliding = false;
          player.scale.y = 1;
          player.position.y = playerY;
        } else {
          // crouch
          player.scale.y = 0.45;
          player.position.y = playerY * 0.45;
        }
      } else {
        player.scale.y = 1;
        player.position.y = playerY;
      }

      // Simple run animation
      const runCycle = (distance * 0.35) % (Math.PI * 2);
      const { leftLeg, rightLeg, leftArm, rightArm } = player.userData;
      if (!isJumping && !isSliding) {
        leftLeg.rotation.x = Math.sin(runCycle) * 0.6;
        rightLeg.rotation.x = Math.sin(runCycle + Math.PI) * 0.6;
        leftArm.rotation.x = Math.sin(runCycle + Math.PI) * 0.5;
        rightArm.rotation.x = Math.sin(runCycle) * 0.5;
      } else {
        leftLeg.rotation.x = 0;
        rightLeg.rotation.x = 0;
        leftArm.rotation.x = 0;
        rightArm.rotation.x = 0;
      }

      // Camera follow (slight lag on X)
      camera.position.x += (player.position.x * 0.6 - camera.position.x) * 4 * dt;
      camera.position.y = 5.2 + playerY * 0.3;
      camera.lookAt(player.position.x * 0.5, 1.2 + playerY * 0.4, -12);

      // Coin spin
      coins.forEach(c => {
        if (!c.collected) c.mesh.rotation.z += dt * 4;
      });

      // Collisions
      checkCollisions();
    }

    function checkCollisions() {
      const pX = player.position.x;
      const pZ = 0;

      // ----- Coins -----
      for (let i = coins.length - 1; i >= 0; i--) {
        const c = coins[i];
        if (c.collected) continue;

        const worldPos = new THREE.Vector3();
        c.mesh.getWorldPosition(worldPos);

        // Fast reject
        if (Math.abs(worldPos.z) > 2.5) continue;

        const dx = worldPos.x - pX;
        const dy = worldPos.y - (playerY + 0.9);
        const dz = worldPos.z;
        const distSq = dx * dx + dy * dy + dz * dz;

        if (distSq < 1.3 * 1.3) {
          c.collected = true;
          c.mesh.visible = false;
          collectedCoinBonus += 50;
          score += 50;
          document.getElementById('score').textContent = score;
        }
      }

      // ----- Obstacles -----
      for (const o of obstacles) {
        if (!o.mesh.parent) continue; // already removed

        const worldPos = new THREE.Vector3();
        o.mesh.getWorldPosition(worldPos);

        // Only check obstacles near the player
        if (Math.abs(worldPos.z) > 2.2) continue;

        // Lane proximity (allow some leeway while switching lanes)
        const laneDist = Math.abs(worldPos.x - pX);
        if (laneDist > 1.35) continue;

        const type = o.type;
        const zHit = Math.abs(worldPos.z) < 1.15;

        if (!zHit) continue;

        if (type === 'low') {
          // Must jump – safe only if high enough
          if (playerY < 0.9) {
            gameOver();
            return;
          }
        } else if (type === 'high') {
          // Must slide – safe only while sliding
          if (!isSliding) {
            gameOver();
            return;
          }
        } else if (type === 'wall') {
          // Full block – always fatal if in same lane
          gameOver();
          return;
        }
      }

      // ----- Aliens (sudden) -----
      for (const a of aliens) {
        if (!a.alive) continue;

        // Alien is in world space already
        const ax = a.mesh.position.x;
        const az = a.mesh.position.z;

        if (Math.abs(az) > 2.0) continue;

        const laneDist = Math.abs(ax - pX);
        if (laneDist > 1.3) continue;

        // Jump over alien or change lane – sliding does NOT help
        if (playerY < 1.1) {
          gameOver();
          return;
        }
      }

      // ----- Fox chase catch -----
      if (fox && fox.alive) {
        const fx = fox.mesh.position.x;
        const fz = fox.mesh.position.z;

        // Fox is behind / near player
        if (fz > -1.5 && fz < FOX_CATCH_DISTANCE) {
          const laneDist = Math.abs(fx - pX);
          // Jumping high helps briefly escape
          if (laneDist < 1.25 && playerY < 1.0) {
            gameOver();
            return;
          }
        }
      }
    }

    // ============================================================
    // RENDER
    // ============================================================
    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05); // clamp for stability

      update(dt);
      renderer.render(scene, camera);
    }

    function onResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    // Boot
    init();
  </script>
</body>
</html>
