<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Real Carrom – Classic Board Game</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #1a120b;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    #wrap {
      position: relative;
      width: 100%; height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse at center, #2c1e12 0%, #0d0906 100%);
    }
    canvas {
      display: block;
      box-shadow: 0 0 40px rgba(0,0,0,0.8), 0 0 80px rgba(139,90,43,0.25);
      border-radius: 8px;
      max-width: 100%;
      max-height: 100%;
    }
    #ui {
      position: absolute;
      top: 0; left: 0; right: 0;
      pointer-events: none;
      z-index: 10;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 8px;
    }
    .panel {
      background: rgba(0,0,0,0.65);
      color: #f5e6c8;
      padding: 10px 16px;
      border-radius: 10px;
      border: 1px solid rgba(212,175,55,0.35);
      font-size: 14px;
      line-height: 1.5;
      backdrop-filter: blur(6px);
    }
    .panel strong { color: #ffd700; }
    .panel .turn { color: #7cfc00; font-weight: 700; }
    #msg {
      position: absolute;
      bottom: 20px; left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.75);
      color: #fff;
      padding: 10px 22px;
      border-radius: 30px;
      font-size: 15px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s;
      z-index: 12;
      white-space: nowrap;
    }
    #msg.show { opacity: 1; }
    #overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.78);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      color: #f5e6c8;
      text-align: center;
      padding: 20px;
    }
    #overlay.hidden { display: none; }
    #overlay h1 {
      font-size: clamp(28px, 8vw, 48px);
      margin-bottom: 8px;
      color: #ffd700;
      text-shadow: 0 0 20px rgba(255,200,0,0.4);
    }
    #overlay p { opacity: 0.9; margin-bottom: 20px; max-width: 360px; font-size: 15px; }
    .btn {
      background: linear-gradient(135deg, #c9a227, #8b6914);
      border: none;
      color: #1a120b;
      font-size: 17px;
      font-weight: 700;
      padding: 12px 32px;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 18px rgba(201,162,39,0.45);
      pointer-events: auto;
      margin: 6px;
    }
    .btn:hover { transform: scale(1.04); }
    .btn.secondary {
      background: transparent;
      border: 2px solid #c9a227;
      color: #ffd700;
    }
    #power-bar-wrap {
      position: absolute;
      bottom: 70px; left: 50%;
      transform: translateX(-50%);
      width: min(280px, 70vw);
      height: 14px;
      background: rgba(0,0,0,0.5);
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.2);
      opacity: 0;
      transition: opacity 0.2s;
      z-index: 11;
      pointer-events: none;
    }
    #power-bar-wrap.show { opacity: 1; }
    #power-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #2ecc71, #f1c40f, #e74c3c);
      border-radius: 8px;
      transition: width 0.05s linear;
    }
  </style>
</head>
<body>
  <div id="wrap">
    <canvas id="c"></canvas>
    <div id="ui">
      <div class="panel" id="score-panel">
        White: <strong id="s-white">0</strong> &nbsp;|&nbsp;
        Black: <strong id="s-black">0</strong><br>
        Queen: <span id="queen-status">Board</span>
      </div>
      <div class="panel">
        Turn: <span class="turn" id="turn-label">White</span><br>
        <span id="hint">Drag striker to aim &amp; set power</span>
      </div>
    </div>
    <div id="power-bar-wrap"><div id="power-bar"></div></div>
    <div id="msg"></div>
    <div id="overlay">
      <h1>CARROM</h1>
      <p>Classic Indian board game. Pocket your coins &amp; the Queen. Cover the Queen with one of your coins to score it.</p>
      <button class="btn" id="btn-start">PLAY</button>
      <button class="btn secondary" id="btn-howto">How to Play</button>
    </div>
  </div>

  <script>
  (() => {
    // ============================================================
    // CONFIG
    // ============================================================
    const BOARD = 700;                 // logical board size
    const RIM = 28;
    const PLAY = BOARD - RIM * 2;      // playable area
    const POCKET_R = 28;
    const COIN_R = 14;
    const STRIKER_R = 18;
    const QUEEN_R = 14;
    const FRICTION_K = 1.35;         // exponential damping: v *= exp(-k*dt)
    const MIN_SPEED = 8;             // stop when slower than this (units/sec)
    const MAX_SPEED = 920;           // max striker speed units/sec
    const RESTITUTION = 0.9;
    const WALL_BOUNCE = 0.88;

    // Colors
    const WOOD_DARK = '#3d2b1f';
    const WOOD_MID = '#5c4033';
    const WOOD_LIGHT = '#8b6914';
    const CLOTH = '#1a4d2e';
    const LINE = 'rgba(255,255,255,0.35)';

    // ============================================================
    // STATE
    // ============================================================
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    let scale = 1, offsetX = 0, offsetY = 0;

    let coins = [];          // {x,y,vx,vy,r,color,type,pocketed}
    let striker = null;
    let queen = null;
    let currentTurn = 'white'; // white | black
    let score = { white: 0, black: 0 };
    let queenPocketedBy = null; // who pocketed queen (needs cover)
    let queenCovered = false;
    let gameState = 'menu'; // menu | aiming | shooting | settling | gameover
    let winner = null;

    // Aiming
    let aiming = false;
    let aimStart = null;
    let aimCurrent = null;
    let power = 0;

    // Striker base positions (bottom for white, top for black)
    const STRIKER_Y_WHITE = BOARD - RIM - 55;
    const STRIKER_Y_BLACK = RIM + 55;
    let strikerBaseX = BOARD / 2;

    // ============================================================
    // INIT / RESIZE
    // ============================================================
    function resize() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      const size = Math.min(w, h) * 0.96;
      canvas.width = size;
      canvas.height = size;
      scale = size / BOARD;
      offsetX = 0;
      offsetY = 0;
      draw();
    }
    window.addEventListener('resize', resize);

    function toBoard(clientX, clientY) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: (clientX - rect.left) / scale,
        y: (clientY - rect.top) / scale
      };
    }

    // ============================================================
    // SETUP PIECES
    // ============================================================
    function resetBoard() {
      coins = [];
      queen = null;
      striker = null;
      score = { white: 0, black: 0 };
      queenPocketedBy = null;
      queenCovered = false;
      currentTurn = 'white';
      winner = null;
      gameState = 'aiming';
      strikerBaseX = BOARD / 2;

      // Standard carrom arrangement – center circle
      const cx = BOARD / 2;
      const cy = BOARD / 2;

      // Queen in center
      queen = makePiece(cx, cy, QUEEN_R, '#c0392b', 'queen');

      // Surrounding coins in a flower pattern (no overlaps)
      const positions = [];
      const gap = COIN_R * 2 + 2;
      // Inner ring (around queen)
      for (let i = 0; i < 6; i++) {
        const a = (i / 6) * Math.PI * 2 - Math.PI / 2;
        positions.push({ x: cx + Math.cos(a) * (QUEEN_R + COIN_R + 4), y: cy + Math.sin(a) * (QUEEN_R + COIN_R + 4) });
      }
      // Outer ring
      for (let i = 0; i < 12; i++) {
        const a = (i / 12) * Math.PI * 2 + Math.PI / 12;
        positions.push({ x: cx + Math.cos(a) * (QUEEN_R + COIN_R * 3 + 10), y: cy + Math.sin(a) * (QUEEN_R + COIN_R * 3 + 10) });
      }

      // Alternate white / black
      positions.forEach((p, i) => {
        const isWhite = i % 2 === 0;
        coins.push(makePiece(p.x, p.y, COIN_R, isWhite ? '#f5f5f0' : '#1a1a1a', isWhite ? 'white' : 'black'));
      });

      placeStriker();
      updateUI();
      showMsg(currentTurn === 'white' ? 'White to play' : 'Black to play');
    }

    function makePiece(x, y, r, color, type) {
      return { x, y, vx: 0, vy: 0, r, color, type, pocketed: false };
    }

    function placeStriker() {
      const y = currentTurn === 'white' ? STRIKER_Y_WHITE : STRIKER_Y_BLACK;
      // Keep striker on the baseline within legal range
      const minX = RIM + STRIKER_R + 10;
      const maxX = BOARD - RIM - STRIKER_R - 10;
      strikerBaseX = Math.max(minX, Math.min(maxX, strikerBaseX));
      striker = makePiece(strikerBaseX, y, STRIKER_R, '#e8e8e8', 'striker');
      striker.vx = 0;
      striker.vy = 0;
    }

    // ============================================================
    // PHYSICS
    // ============================================================
    function updatePhysics(dt) {
      const pieces = getActivePieces();
      // More substeps when anything is moving fast (prevent tunneling)
      let maxV = 0;
      for (const p of pieces) {
        if (p.pocketed) continue;
        maxV = Math.max(maxV, Math.hypot(p.vx, p.vy));
      }
      const steps = maxV > 400 ? 12 : maxV > 200 ? 8 : 5;
      const h = dt / steps;

      // Frame-rate independent friction
      const frictionFactor = Math.exp(-FRICTION_K * dt);

      for (let s = 0; s < steps; s++) {
        // Integrate positions
        for (const p of pieces) {
          if (p.pocketed) continue;
          p.x += p.vx * h;
          p.y += p.vy * h;
        }

        // Wall collisions
        for (const p of pieces) {
          if (p.pocketed) continue;
          const min = RIM + p.r;
          const max = BOARD - RIM - p.r;

          if (p.x < min) {
            if (!nearPocket(p.x, p.y)) {
              p.x = min;
              p.vx = Math.abs(p.vx) * WALL_BOUNCE;
            }
          } else if (p.x > max) {
            if (!nearPocket(p.x, p.y)) {
              p.x = max;
              p.vx = -Math.abs(p.vx) * WALL_BOUNCE;
            }
          }
          if (p.y < min) {
            if (!nearPocket(p.x, p.y)) {
              p.y = min;
              p.vy = Math.abs(p.vy) * WALL_BOUNCE;
            }
          } else if (p.y > max) {
            if (!nearPocket(p.x, p.y)) {
              p.y = max;
              p.vy = -Math.abs(p.vy) * WALL_BOUNCE;
            }
          }
        }

        // Piece-piece collisions
        for (let i = 0; i < pieces.length; i++) {
          for (let j = i + 1; j < pieces.length; j++) {
            const a = pieces[i], b = pieces[j];
            if (a.pocketed || b.pocketed) continue;
            resolveCollision(a, b);
          }
        }

        // Pocket check
        for (const p of pieces) {
          if (p.pocketed) continue;
          if (inPocket(p.x, p.y, p.r)) {
            pocketPiece(p);
          }
        }
      }

      // Apply friction once after all substeps
      for (const p of pieces) {
        if (p.pocketed) continue;
        p.vx *= frictionFactor;
        p.vy *= frictionFactor;
        if (Math.hypot(p.vx, p.vy) < MIN_SPEED) {
          p.vx = 0;
          p.vy = 0;
        }
      }
    }

    function getActivePieces() {
      const list = coins.filter(c => !c.pocketed);
      if (queen && !queen.pocketed) list.push(queen);
      if (striker && !striker.pocketed) list.push(striker);
      return list;
    }

    function resolveCollision(a, b) {
      const dx = b.x - a.x;
      const dy = b.y - a.y;
      const dist = Math.hypot(dx, dy);
      const minDist = a.r + b.r;
      if (dist === 0 || dist >= minDist) return;

      // Separate
      const overlap = minDist - dist;
      const nx = dx / dist;
      const ny = dy / dist;
      a.x -= nx * overlap * 0.5;
      a.y -= ny * overlap * 0.5;
      b.x += nx * overlap * 0.5;
      b.y += ny * overlap * 0.5;

      // Relative velocity
      const dvx = a.vx - b.vx;
      const dvy = a.vy - b.vy;
      const vn = dvx * nx + dvy * ny;
      if (vn > 0) return; // separating

      // Impulse (equal mass)
      const impulse = -(1 + RESTITUTION) * vn / 2;
      a.vx += impulse * nx;
      a.vy += impulse * ny;
      b.vx -= impulse * nx;
      b.vy -= impulse * ny;
    }

    function nearPocket(x, y) {
      const pockets = [
        [RIM, RIM], [BOARD - RIM, RIM],
        [RIM, BOARD - RIM], [BOARD - RIM, BOARD - RIM]
      ];
      for (const [px, py] of pockets) {
        if (Math.hypot(x - px, y - py) < POCKET_R + 20) return true;
      }
      return false;
    }

    function inPocket(x, y, r) {
      const pockets = [
        [RIM, RIM], [BOARD - RIM, RIM],
        [RIM, BOARD - RIM], [BOARD - RIM, BOARD - RIM]
      ];
      for (const [px, py] of pockets) {
        if (Math.hypot(x - px, y - py) < POCKET_R - r * 0.3) return true;
      }
      return false;
    }

    // ============================================================
    // POCKETING / SCORING
    // ============================================================
    let pocketedThisTurn = []; // track what was pocketed in current shot

    function pocketPiece(p) {
      p.pocketed = true;
      p.vx = 0;
      p.vy = 0;
      pocketedThisTurn.push(p);

      if (p.type === 'striker') {
        showMsg('Foul! Striker pocketed');
        // Penalty: return one coin of opponent or just foul
      } else if (p.type === 'queen') {
        queenPocketedBy = currentTurn;
        showMsg('Queen pocketed! Cover it with your coin');
      } else if (p.type === 'white' || p.type === 'black') {
        if (p.type === currentTurn) {
          score[currentTurn]++;
          // If queen was pocketed earlier this turn or previously and needs cover
          if (queenPocketedBy === currentTurn && !queenCovered) {
            queenCovered = true;
            score[currentTurn] += 3; // queen points
            document.getElementById('queen-status').textContent = 'Covered by ' + currentTurn;
            showMsg('Queen covered! +3');
          }
        } else {
          // Opponent's coin
          score[p.type]++;
        }
      }
      updateUI();
    }

    function allStopped() {
      return getActivePieces().every(p => Math.hypot(p.vx, p.vy) < MIN_SPEED);
    }

    function endTurn() {
      // Handle foul (striker pocketed)
      const strikerFoul = pocketedThisTurn.some(p => p.type === 'striker');
      if (strikerFoul && striker) {
        striker.pocketed = false;
        // Return striker, and optionally return last pocketed own coin as penalty
        const ownPocketed = pocketedThisTurn.find(p => p.type === currentTurn);
        if (ownPocketed && score[currentTurn] > 0) {
          score[currentTurn]--;
          ownPocketed.pocketed = false;
          // Place it back near center
          ownPocketed.x = BOARD / 2 + (Math.random() - 0.5) * 40;
          ownPocketed.y = BOARD / 2 + (Math.random() - 0.5) * 40;
          ownPocketed.vx = 0;
          ownPocketed.vy = 0;
        }
      }

      // Queen not covered → return queen
      if (queenPocketedBy && !queenCovered && queen) {
        queen.pocketed = false;
        queen.x = BOARD / 2;
        queen.y = BOARD / 2;
        queen.vx = 0;
        queen.vy = 0;
        queenPocketedBy = null;
        showMsg('Queen returned – not covered');
        document.getElementById('queen-status').textContent = 'Board';
      }

      // Continue turn if you pocketed your own coin (and no foul)
      const pocketedOwn = pocketedThisTurn.some(p => p.type === currentTurn);
      const keepTurn = pocketedOwn && !strikerFoul;

      pocketedThisTurn = [];

      // Check win
      const whiteLeft = coins.filter(c => c.type === 'white' && !c.pocketed).length;
      const blackLeft = coins.filter(c => c.type === 'black' && !c.pocketed).length;

      if (whiteLeft === 0 && (queenCovered || !queen || queen.pocketed)) {
        winner = 'White';
        endGame();
        return;
      }
      if (blackLeft === 0 && (queenCovered || !queen || queen.pocketed)) {
        winner = 'Black';
        endGame();
        return;
      }

      if (!keepTurn) {
        currentTurn = currentTurn === 'white' ? 'black' : 'white';
      }

      placeStriker();
      gameState = 'aiming';
      updateUI();
      showMsg((currentTurn === 'white' ? 'White' : 'Black') + ' to play');
    }

    function endGame() {
      gameState = 'gameover';
      document.getElementById('overlay').classList.remove('hidden');
      document.querySelector('#overlay h1').textContent = winner + ' Wins!';
      document.querySelector('#overlay p').textContent =
        `Final Score — White: ${score.white}  |  Black: ${score.black}`;
      document.getElementById('btn-start').textContent = 'PLAY AGAIN';
    }

    // ============================================================
    // INPUT
    // ============================================================
    function onPointerDown(e) {
      if (gameState !== 'aiming') return;
      e.preventDefault();
      const pos = toBoard(e.clientX || e.touches[0].clientX, e.clientY || e.touches[0].clientY);

      // First: allow moving striker on baseline
      if (isOnStriker(pos) || isOnBaseline(pos)) {
        // Move striker horizontally
        const minX = RIM + STRIKER_R + 8;
        const maxX = BOARD - RIM - STRIKER_R - 8;
        striker.x = Math.max(minX, Math.min(maxX, pos.x));
        strikerBaseX = striker.x;
        aiming = true;
        aimStart = { x: striker.x, y: striker.y };
        aimCurrent = { ...aimStart };
        power = 0;
        document.getElementById('power-bar-wrap').classList.add('show');
      }
    }

    function onPointerMove(e) {
      if (!aiming || gameState !== 'aiming') return;
      e.preventDefault();
      const pos = toBoard(e.clientX || e.touches[0].clientX, e.clientY || e.touches[0].clientY);

      // If still near baseline and not pulled much, just slide striker
      const pullDist = Math.hypot(pos.x - striker.x, pos.y - striker.y);
      if (pullDist < 25 && Math.abs(pos.y - striker.y) < 30) {
        const minX = RIM + STRIKER_R + 8;
        const maxX = BOARD - RIM - STRIKER_R - 8;
        striker.x = Math.max(minX, Math.min(maxX, pos.x));
        strikerBaseX = striker.x;
        aimStart = { x: striker.x, y: striker.y };
        aimCurrent = { ...aimStart };
        power = 0;
      } else {
        // Aim opposite to drag (like real carrom – pull back to shoot forward)
        aimCurrent = pos;
        const dx = aimStart.x - pos.x;
        const dy = aimStart.y - pos.y;
        const pull = Math.hypot(dx, dy);
        // Map pull distance (0–180px board units) → 0–1 power
        power = Math.min(1, pull / 140);
        document.getElementById('power-bar').style.width = (power * 100) + '%';
      }
    }

    function onPointerUp(e) {
      if (!aiming || gameState !== 'aiming') return;
      e.preventDefault();
      aiming = false;
      document.getElementById('power-bar-wrap').classList.remove('show');

      if (power > 0.06 && aimCurrent) {
        const dx = aimStart.x - aimCurrent.x;
        const dy = aimStart.y - aimCurrent.y;
        const len = Math.hypot(dx, dy) || 1;
        // power 0..1 → speed up to MAX_SPEED
        const speed = 120 + power * (MAX_SPEED - 120);
        striker.vx = (dx / len) * speed;
        striker.vy = (dy / len) * speed;
        gameState = 'shooting';
        pocketedThisTurn = [];
      }
      power = 0;
      aimStart = null;
      aimCurrent = null;
    }

    function isOnStriker(pos) {
      if (!striker) return false;
      return Math.hypot(pos.x - striker.x, pos.y - striker.y) < STRIKER_R + 20;
    }

    function isOnBaseline(pos) {
      const y = currentTurn === 'white' ? STRIKER_Y_WHITE : STRIKER_Y_BLACK;
      return Math.abs(pos.y - y) < 40 && pos.x > RIM && pos.x < BOARD - RIM;
    }

    canvas.addEventListener('mousedown', onPointerDown);
    canvas.addEventListener('mousemove', onPointerMove);
    canvas.addEventListener('mouseup', onPointerUp);
    canvas.addEventListener('mouseleave', onPointerUp);
    canvas.addEventListener('touchstart', onPointerDown, { passive: false });
    canvas.addEventListener('touchmove', onPointerMove, { passive: false });
    canvas.addEventListener('touchend', onPointerUp, { passive: false });

    // ============================================================
    // DRAWING
    // ============================================================
    function draw() {
      ctx.save();
      ctx.scale(scale, scale);
      ctx.clearRect(0, 0, BOARD, BOARD);

      drawBoard();
      drawPieces();
      drawAim();

      ctx.restore();
    }

    function drawBoard() {
      // Outer wood frame
      const grd = ctx.createLinearGradient(0, 0, BOARD, BOARD);
      grd.addColorStop(0, '#4a3728');
      grd.addColorStop(0.5, '#6b4423');
      grd.addColorStop(1, '#3d2b1f');
      ctx.fillStyle = grd;
      roundRect(0, 0, BOARD, BOARD, 12);
      ctx.fill();

      // Inner rim
      ctx.fillStyle = '#2a1c14';
      ctx.fillRect(RIM - 8, RIM - 8, PLAY + 16, PLAY + 16);

      // Playing surface (cloth)
      const cloth = ctx.createRadialGradient(BOARD/2, BOARD/2, 50, BOARD/2, BOARD/2, BOARD*0.6);
      cloth.addColorStop(0, '#1f5c38');
      cloth.addColorStop(1, '#143d28');
      ctx.fillStyle = cloth;
      ctx.fillRect(RIM, RIM, PLAY, PLAY);

      // Center circle
      ctx.strokeStyle = LINE;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(BOARD/2, BOARD/2, 55, 0, Math.PI * 2);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(BOARD/2, BOARD/2, 18, 0, Math.PI * 2);
      ctx.stroke();

      // Diagonal lines (decorative)
      ctx.beginPath();
      ctx.moveTo(RIM + 60, RIM + 60);
      ctx.lineTo(BOARD/2 - 40, BOARD/2 - 40);
      ctx.moveTo(BOARD - RIM - 60, RIM + 60);
      ctx.lineTo(BOARD/2 + 40, BOARD/2 - 40);
      ctx.moveTo(RIM + 60, BOARD - RIM - 60);
      ctx.lineTo(BOARD/2 - 40, BOARD/2 + 40);
      ctx.moveTo(BOARD - RIM - 60, BOARD - RIM - 60);
      ctx.lineTo(BOARD/2 + 40, BOARD/2 + 40);
      ctx.stroke();

      // Baselines (striker lines)
      ctx.strokeStyle = 'rgba(255,215,0,0.45)';
      ctx.lineWidth = 2;
      ctx.setLineDash([6, 4]);
      // White baseline (bottom)
      ctx.beginPath();
      ctx.moveTo(RIM + 40, STRIKER_Y_WHITE);
      ctx.lineTo(BOARD - RIM - 40, STRIKER_Y_WHITE);
      ctx.stroke();
      // Black baseline (top)
      ctx.beginPath();
      ctx.moveTo(RIM + 40, STRIKER_Y_BLACK);
      ctx.lineTo(BOARD - RIM - 40, STRIKER_Y_BLACK);
      ctx.stroke();
      ctx.setLineDash([]);

      // Corner pockets
      const pockets = [
        [RIM, RIM], [BOARD - RIM, RIM],
        [RIM, BOARD - RIM], [BOARD - RIM, BOARD - RIM]
      ];
      for (const [px, py] of pockets) {
        // Hole
        const pg = ctx.createRadialGradient(px, py, 2, px, py, POCKET_R);
        pg.addColorStop(0, '#0a0a0a');
        pg.addColorStop(0.7, '#1a1a1a');
        pg.addColorStop(1, '#2a1c14');
        ctx.fillStyle = pg;
        ctx.beginPath();
        ctx.arc(px, py, POCKET_R, 0, Math.PI * 2);
        ctx.fill();
        // Rim highlight
        ctx.strokeStyle = 'rgba(139,105,20,0.6)';
        ctx.lineWidth = 3;
        ctx.stroke();
      }

      // Corner decorations
      ctx.fillStyle = 'rgba(201,162,39,0.25)';
      [[RIM+15,RIM+15],[BOARD-RIM-15,RIM+15],[RIM+15,BOARD-RIM-15],[BOARD-RIM-15,BOARD-RIM-15]].forEach(([x,y]) => {
        ctx.beginPath();
        ctx.arc(x, y, 6, 0, Math.PI*2);
        ctx.fill();
      });
    }

    function drawPieces() {
      // Coins
      for (const c of coins) {
        if (c.pocketed) continue;
        drawCoin(c);
      }
      // Queen
      if (queen && !queen.pocketed) {
        drawQueen(queen);
      }
      // Striker
      if (striker && !striker.pocketed) {
        drawStriker(striker);
      }
    }

    function drawCoin(c) {
      ctx.save();
      ctx.translate(c.x, c.y);

      // Shadow
      ctx.beginPath();
      ctx.arc(2, 3, c.r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.fill();

      // Body
      const g = ctx.createRadialGradient(-4, -4, 2, 0, 0, c.r);
      if (c.type === 'white') {
        g.addColorStop(0, '#ffffff');
        g.addColorStop(0.7, '#e8e8e0');
        g.addColorStop(1, '#c0c0b0');
      } else {
        g.addColorStop(0, '#444');
        g.addColorStop(0.6, '#1a1a1a');
        g.addColorStop(1, '#0a0a0a');
      }
      ctx.beginPath();
      ctx.arc(0, 0, c.r, 0, Math.PI * 2);
      ctx.fillStyle = g;
      ctx.fill();

      // Rim
      ctx.strokeStyle = c.type === 'white' ? 'rgba(0,0,0,0.2)' : 'rgba(255,255,255,0.15)';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      // Center dot
      ctx.beginPath();
      ctx.arc(0, 0, 3, 0, Math.PI * 2);
      ctx.fillStyle = c.type === 'white' ? 'rgba(0,0,0,0.15)' : 'rgba(255,255,255,0.2)';
      ctx.fill();

      ctx.restore();
    }

    function drawQueen(q) {
      ctx.save();
      ctx.translate(q.x, q.y);

      ctx.beginPath();
      ctx.arc(2, 3, q.r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.fill();

      const g = ctx.createRadialGradient(-4, -4, 2, 0, 0, q.r);
      g.addColorStop(0, '#e74c3c');
      g.addColorStop(0.5, '#c0392b');
      g.addColorStop(1, '#7b241c');
      ctx.beginPath();
      ctx.arc(0, 0, q.r, 0, Math.PI * 2);
      ctx.fillStyle = g;
      ctx.fill();

      // Crown pattern
      ctx.fillStyle = 'rgba(255,215,0,0.85)';
      ctx.beginPath();
      ctx.arc(0, 0, 5, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.4)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(0, 0, q.r - 1, 0, Math.PI * 2);
      ctx.stroke();

      ctx.restore();
    }

    function drawStriker(s) {
      ctx.save();
      ctx.translate(s.x, s.y);

      ctx.beginPath();
      ctx.arc(2, 3, s.r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      ctx.fill();

      const g = ctx.createRadialGradient(-5, -5, 3, 0, 0, s.r);
      g.addColorStop(0, '#f8f8f8');
      g.addColorStop(0.6, '#d0d0d0');
      g.addColorStop(1, '#909090');
      ctx.beginPath();
      ctx.arc(0, 0, s.r, 0, Math.PI * 2);
      ctx.fillStyle = g;
      ctx.fill();

      ctx.strokeStyle = 'rgba(0,0,0,0.25)';
      ctx.lineWidth = 2;
      ctx.stroke();

      // Inner ring
      ctx.beginPath();
      ctx.arc(0, 0, s.r * 0.55, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(0,0,0,0.15)';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      ctx.restore();
    }

    function drawAim() {
      if (!aiming || !aimStart || !aimCurrent || power < 0.04) return;

      const dx = aimStart.x - aimCurrent.x;
      const dy = aimStart.y - aimCurrent.y;
      const len = Math.hypot(dx, dy) || 1;
      const ux = dx / len;
      const uy = dy / len;

      const lineLen = 60 + power * 160;

      // Aim line
      ctx.strokeStyle = `rgba(255,215,0,${0.35 + power * 0.55})`;
      ctx.lineWidth = 2.5;
      ctx.setLineDash([8, 6]);
      ctx.beginPath();
      ctx.moveTo(striker.x, striker.y);
      ctx.lineTo(striker.x + ux * lineLen, striker.y + uy * lineLen);
      ctx.stroke();
      ctx.setLineDash([]);

      // Arrow head
      const ax = striker.x + ux * (lineLen - 8);
      const ay = striker.y + uy * (lineLen - 8);
      ctx.fillStyle = 'rgba(255,215,0,0.9)';
      ctx.beginPath();
      ctx.moveTo(ax + ux * 14, ay + uy * 14);
      ctx.lineTo(ax - uy * 8, ay + ux * 8);
      ctx.lineTo(ax + uy * 8, ay - ux * 8);
      ctx.closePath();
      ctx.fill();
    }

    function roundRect(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    // ============================================================
    // UI HELPERS
    // ============================================================
    function updateUI() {
      document.getElementById('s-white').textContent = score.white;
      document.getElementById('s-black').textContent = score.black;
      document.getElementById('turn-label').textContent = currentTurn === 'white' ? 'White' : 'Black';
      document.getElementById('turn-label').style.color = currentTurn === 'white' ? '#7cfc00' : '#87ceeb';
    }

    let msgTimer = null;
    function showMsg(text) {
      const el = document.getElementById('msg');
      el.textContent = text;
      el.classList.add('show');
      clearTimeout(msgTimer);
      msgTimer = setTimeout(() => el.classList.remove('show'), 2200);
    }

    // ============================================================
    // LOOP
    // ============================================================
    let last = performance.now();
    function loop(now) {
      const dt = Math.min((now - last) / 1000, 0.05);
      last = now;

      if (gameState === 'shooting' || gameState === 'settling') {
        updatePhysics(dt);
        if (allStopped()) {
          if (gameState === 'shooting') {
            gameState = 'settling';
            // small delay then end turn
            setTimeout(() => {
              if (gameState === 'settling') endTurn();
            }, 280);
          }
        }
      }

      draw();
      requestAnimationFrame(loop);
    }

    // ============================================================
    // BUTTONS
    // ============================================================
    document.getElementById('btn-start').addEventListener('click', () => {
      document.getElementById('overlay').classList.add('hidden');
      resetBoard();
    });

    document.getElementById('btn-howto').addEventListener('click', () => {
      alert(
        'HOW TO PLAY CARROM\n\n' +
        '1. Drag the striker on your baseline to position it.\n' +
        '2. Pull back to aim and set power, then release to shoot.\n' +
        '3. Pocket your own coins (White or Black).\n' +
        '4. Pocket the Red Queen, then cover it by pocketing one of your coins in the same or next turn.\n' +
        '5. If you pocket the striker → Foul.\n' +
        '6. Clear all your coins (and cover Queen) to win!\n\n' +
        'Two players take turns (White & Black).'
      );
    });

    // Boot
    resize();
    requestAnimationFrame(loop);
  })();
  </script>
</body>
</html>
